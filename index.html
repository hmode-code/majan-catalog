<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتالوج المعجنات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #FAF4EE; direction: rtl; }
  header { background: #2D1B0E; color: #F5C89A; text-align: center; padding: 24px; }
  header h1 { font-size: 28px; margin-bottom: 4px; }
  header p { color: #B8896A; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; padding: 20px; max-width: 800px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; overflow: hidden; text-align: center; box-shadow: 0 2px 12px #0001; }
  .img-wrap { width: 100%; height: 160px; overflow: hidden; background: #FDF6EE; display: flex; align-items: center; justify-content: center; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .emoji { font-size: 64px; }
  .card h3 { color: #2D1B0E; font-size: 15px; margin: 10px 10px 6px; }
  .desc { color: #7A5A3A; font-size: 12px; margin: 0 10px 10px; line-height: 1.5; }
  .price { color: #C4742A; font-size: 17px; font-weight: bold; padding: 10px; background: #FDF6EE; }
  footer { text-align: center; padding: 20px; color: #B8896A; font-size: 12px; }
</style>
</head>
