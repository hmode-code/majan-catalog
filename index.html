<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كتالوج المعجنات</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #FAF4EE; direction: rtl; }
  header { background: #2D1B0E; color: #F5C89A; text-align: center; padding: 20px; position: sticky; top: 0; z-index: 10; }
  header h1 { font-size: 24px; margin-bottom: 2px; }
  header p { color: #B8896A; font-size: 13px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 14px; padding: 16px; max-width: 800px; margin: 0 auto; }
  .card { background: white; border-radius: 16px; overflow: hidden; cursor: pointer; box-shadow: 0 2px 12px #0001; transition: transform .15s; }
  .card:active { transform: scale(0.97); }
  .img-wrap { width: 100%; height: 155px; overflow: hidden; background: #FDF6EE; display: flex; align-items: center; justify-content: center; }
  .img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .emoji { font-size: 56px; }
  .card-info { padding: 10px; }
  .card-info h3 { color: #2D1B0E; font-size: 14px; margin-bottom: 4px; }
  .pieces { color: #7A5A3A; font-size: 12px; margin-bottom: 4px; }
  .price { color: #C4742A; font-size: 16px; font-weight: bold; }

  /* Detail page */
  #detail { display: none; position: fixed; inset: 0; background: #FAF4EE; overflow-y: auto; z-index: 100; }
  .detail-header { background: #2D1B0E; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; }
  .back-btn { background: #C4742A; color: white; border: none; border-radius: 20px; padding: 8px 18px; font-size: 14px; cursor: pointer; font-family: inherit; }
  .detail-header span { color: #F5C89A; font-size: 18px; font-weight: bold; flex: 1; }
  .slides { position: relative; width: 100%; height: 280px; background: #FDF6EE; overflow: hidden; }
  .slides img { position: absolute; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
  .slides img.active { opacity: 1; }
  .slide-dots { display: flex; justify-content: center; gap: 6px; padding: 10px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #E0C8A0; border: none; cursor: pointer; }
  .dot.active { background: #C4742A; width: 20px; border-radius: 4px; }
  .detail-info { padding: 20px; }
  .detail-info h2 { color: #2D1B0E; font-size: 22px; margin-bottom: 8px; }
  .detail-price { color: #C4742A; font-size: 24px; font-weight: bold; margin-bottom: 8px; }
  .detail-pieces { color: #7A5A3A; font-size: 15px; }

  footer { text-align: center; padding: 16px; color: #B8896A; font-size: 11px; }
</style>
</head>
<body>

<!-- Main catalog -->
<div id="main">
  <header>
    <h1>🥐 كتالوج المعجنات</h1>
   <a href="https://wa.me/9647703364893" style="color:#25D366;text-decoration:none;font-size:16px;">
  <img src="https://upload.wikimedia.org/wikipedia/commons/6/6b/WhatsApp.svg" width="20" style="vertical-align:middle;margin-left:6px">
  07703364893
</a>
  </header>
  <div class="grid"><div class="card" onclick="showDetail('11')">
                <div class="img-wrap"><img src="https://i.imgur.com/VDCjsCa.jpeg" alt="اا" onerror="this.style.display='none'"></div>
                <div class="card-info">
                    <h3>اا</h3>
                    <div class="pieces">22 قطعة</div>
                    <div class="price">٥٥ د.ع</div>
                </div>
            </div><div class="card" onclick="showDetail('10')">
                <div class="img-wrap"><img src="https://i.imgur.com/TYRfk6N.jpeg" alt="دونت" onerror="this.style.display='none'"></div>
                <div class="card-info">
                    <h3>دونت</h3>
                    <div class="pieces">24 قطعة</div>
                    <div class="price">٢٬٠٠٠ د.ع</div>
                </div>
            </div><div class="card" onclick="showDetail('9')">
                <div class="img-wrap"><img src="https://i.imgur.com/GQuJs3t.jpeg" alt="ارسؤ" onerror="this.style.display='none'"></div>
                <div class="card-info">
                    <h3>ارسؤ</h3>
                    
                    <div class="price">٢٬٠٠٠ د.ع</div>
                </div>
            </div><div class="card" onclick="showDetail('8')">
                <div class="img-wrap"><img src="https://i.imgur.com/cK9luim.jpeg" alt="دونت" onerror="this.style.display='none'"></div>
                <div class="card-info">
                    <h3>دونت</h3>
                    
                    <div class="price">١٬٥٠٠ د.ع</div>
                </div>
            </div><div class="card" onclick="showDetail('7')">
                <div class="img-wrap"><img src="https://i.imgur.com/RHxSn4c.jpeg" alt="كليجة" onerror="this.style.display='none'"></div>
                <div class="card-info">
                    <h3>كليجة</h3>
                    
                    <div class="price">٣٬٠٠٠ د.ع</div>
                </div>
            </div><div class="card" onclick="showDetail('6')">
                <div class="img-wrap"><img src="https://i.imgur.com/C70JLFk.jpeg" alt="دونت" onerror="this.style.display='none'"></div>
                <div class="card-info">
                    <h3>دونت</h3>
                    
                    <div class="price">٢٬٠٠٠ د.ع</div>
                </div>
            </div></div>
  <footer>آخر تحديث: ٠٦/٠٦/٢٠٢٦ ١٩:٢٤</footer>
</div>

<!-- Detail page -->
<div id="detail">
  <div class="detail-header">
    <button class="back-btn" onclick="hideDetail()">← رجوع</button>
    <span id="detail-title"></span>
  </div>
  <div class="slides" id="slides"></div>
  <div class="slide-dots" id="dots"></div>
  <div class="detail-info">
    <h2 id="detail-name"></h2>
    <div class="detail-price" id="detail-price"></div>
    <div class="detail-pieces" id="detail-pieces"></div>
  </div>
</div>

<script>
const products = { '11': {
                name: "اا",
                price: "٥٥ د.ع",
                pieces: "22 قطعة",
                images: ["https://i.imgur.com/VDCjsCa.jpeg"]
            },'10': {
                name: "دونت",
                price: "٢٬٠٠٠ د.ع",
                pieces: "24 قطعة",
                images: ["https://i.imgur.com/TYRfk6N.jpeg"]
            },'9': {
                name: "ارسؤ",
                price: "٢٬٠٠٠ د.ع",
                pieces: "",
                images: ["https://i.imgur.com/GQuJs3t.jpeg"]
            },'8': {
                name: "دونت",
                price: "١٬٥٠٠ د.ع",
                pieces: "",
                images: ["https://i.imgur.com/cK9luim.jpeg"]
            },'7': {
                name: "كليجة",
                price: "٣٬٠٠٠ د.ع",
                pieces: "",
                images: ["https://i.imgur.com/RHxSn4c.jpeg","https://i.imgur.com/BsnrEEG.jpeg"]
            },'6': {
                name: "دونت",
                price: "٢٬٠٠٠ د.ع",
                pieces: "",
                images: ["https://i.imgur.com/C70JLFk.jpeg","https://i.imgur.com/pc19IYR.jpeg"]
            } };
let currentSlide = 0;
let slideImages = [];

function showDetail(id) {
  const p = products[id];
  if (!p) return;
  currentSlide = 0;
  slideImages = p.images;

  document.getElementById('detail-title').textContent = p.name;
  document.getElementById('detail-name').textContent = p.name;
  document.getElementById('detail-price').textContent = p.price;
  document.getElementById('detail-pieces').textContent = p.pieces;

  // Build slides
  const slidesEl = document.getElementById('slides');
  const dotsEl = document.getElementById('dots');
  slidesEl.innerHTML = '';
  dotsEl.innerHTML = '';

  if (slideImages.length === 0) {
    slidesEl.innerHTML = '<div class="emoji" style="display:flex;align-items:center;justify-content:center;height:100%;font-size:80px">🥐</div>';
  } else {
    slideImages.forEach((url, i) => {
      const img = document.createElement('img');
      img.src = url;
      if (i === 0) img.classList.add('active');
      slidesEl.appendChild(img);

      if (slideImages.length > 1) {
        const dot = document.createElement('button');
        dot.className = 'dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goToSlide(i);
        dotsEl.appendChild(dot);
      }
    });
  }

  document.getElementById('main').style.display = 'none';
  document.getElementById('detail').style.display = 'block';
  window.scrollTo(0, 0);
}

function goToSlide(index) {
  const imgs = document.querySelectorAll('#slides img');
  const dots = document.querySelectorAll('.dot');
  imgs[currentSlide]?.classList.remove('active');
  dots[currentSlide]?.classList.remove('active');
  currentSlide = index;
  imgs[currentSlide]?.classList.add('active');
  dots[currentSlide]?.classList.add('active');
}

function hideDetail() {
  document.getElementById('detail').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
</script>
</body>
</html>
